name: NomiIOS

options:
  bundleIdPrefix: com.nomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  NomiIOS:
    type: application
    platform: iOS
    sources:
      - path: NomiIOS
    # NOMI_API_BASE_URL (URL del backend) y, opcionalmente, Config/Local.xcconfig.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomi.ios
        PRODUCT_NAME: Nomi
        INFOPLIST_FILE: NomiIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  NomiIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NomiIOSTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives the host from the target name (NomiIOS.app), but the app's
        # PRODUCT_NAME is Nomi — without this the test bundle has no host to load into.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nomi.app/Nomi"
    dependencies:
      - target: NomiIOS

schemes:
  NomiIOS:
    build:
      targets:
        NomiIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NomiIOSTests
